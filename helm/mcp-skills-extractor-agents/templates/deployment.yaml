apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-skills-extractor-agents.fullname" . }}
  labels:
    {{- include "mcp-skills-extractor-agents.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mcp-skills-extractor-agents.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp-skills-extractor-agents.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mcp-skills-extractor-agents.serviceAccountName" . }}
      securityContext:
        fsGroup: 1000
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          # Set explicitly (not just `args`) so this doesn't depend on the image's own
          # ENTRYPOINT/CMD - `args` alone would run with no entrypoint if the image lacks one.
          command:
            - "mcp-skills-extractor-agents"
          args:
            - "--protocol"
            - {{ .Values.config.protocol | quote }}
            - "--host"
            - {{ .Values.config.host | quote }}
            - "--port"
            - {{ .Values.service.targetPort | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "mcp-skills-extractor-agents.fullname" . }}
            - secretRef:
                name: {{ include "mcp-skills-extractor-agents.fullname" . }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

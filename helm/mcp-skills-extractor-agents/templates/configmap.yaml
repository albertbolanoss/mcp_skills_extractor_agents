apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp-skills-extractor-agents.fullname" . }}
  labels:
    {{- include "mcp-skills-extractor-agents.labels" . | nindent 4 }}
data:
  {{- if .Values.config.activeTools }}
  # Pins this release to a subset of extraction tools - see `config.activeTools` in values.yaml.
  CANDIDATE_SKILL_AGENT_ACTIVE_TOOLS: {{ .Values.config.activeTools | join "," | quote }}
  {{- end }}

  # --- labs_agent_lib.AgentSettings ---
  LABS_AGENT_LIB_PROVIDER: {{ .Values.config.provider | quote }}
  LABS_AGENT_LIB_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LABS_AGENT_LIB_DISABLE_PROMPT_CACHING: {{ .Values.config.disablePromptCaching | quote }}
  LABS_AGENT_LIB_PORTKEY_VIRTUAL: {{ .Values.config.portkeyVirtual | quote }}

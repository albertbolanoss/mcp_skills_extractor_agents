apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-skills-extractor-agents.fullname" . }}
  labels:
    {{- include "mcp-skills-extractor-agents.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Placeholder values - see the comment above `secrets` in values.yaml for how to override
  # these with real credentials at install time instead of committing them here.
  LABS_AGENT_LIB_PORTKEY_API_KEY: {{ .Values.secrets.portkeyApiKey | quote }}
  LABS_AGENT_LIB_ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}

[project]
name = "candidate-skill-agent"
version = "0.1.0"
description = "An MCP (Model Context Protocol) server exposing resume reading and skill-extraction tools/prompts over stdio, HTTP and SSE."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Luis Alberto Bolaños Salazar" }]
keywords = ["mcp", "model-context-protocol", "llm", "langchain", "resume", "candidate-matching"]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "langchain>=1.4.7",
    "langchain-openai>=1.7.3",
    "mcp[cli]>=2.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "labs-agent-lib>=0.4.2",
    "claude-agent-sdk>=0.2.176",
]

[project.urls]
Homepage = "https://github.com/albertbolanoss/candidate-skill-agent"
Repository = "https://github.com/albertbolanoss/candidate-skill-agent"

[project.scripts]
candidate-skill-agent = "mcp_skills_extractor_agents.main:main"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true

[tool.uv.sources]
# labs-agent-lib isn't on the real PyPI yet - resolve it from TestPyPI explicitly.
labs-agent-lib = { index = "testpypi" }

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.0.0",
    "ruff"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mcp_skills_extractor_agents --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["mcp_skills_extractor_agents"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_also = [
    "if __name__ == .__main__.:",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_skills_extractor_agents"]
